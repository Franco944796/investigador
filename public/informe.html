<!doctype html>
<html lang="es">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <header class="herramientas">
      <a class="volver" href="./">← Investigador</a>
      <div class="botones">

    <p id="aviso" class="aviso" role="alert" hidden></p>

    <div class="hoja">
      <nav id="indice" class="indice" aria-label="Índice" hidden>
        <details>
          <summary>Índice</summary>
          <ol></ol>
        </details>
      </nav>
      <article id="documento" class="documento">
        <p class="estado">Cargando el informe…</p>
      </article>
    </div>

    <div id="vista-cita" class="vista-cita" role="tooltip" hidden></div>

    <script src="vendor/marked.js"></script>
    <script src="vendor/purify.js"></script>
